<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17894b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Home Gym Coach</title>
<style>
:root{--bg:#f5f8f6;--card:#ffffff;--card2:#e9efec;--txt:#16231c;--mut:#56645d;--acc:#17894b;--acc2:#0f6e3b;--ok:#17894b;--rest:#1f63c6;--line:#dfe6e2}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
header{padding:18px 18px 6px}h1{font-size:26px;margin:0}h2{font-size:18px;margin:18px 0 8px}
.mut{color:var(--mut);font-size:14px}.wrap{padding:0 14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(20,40,30,.08);border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,#17894b,#0f6e5c);color:#fff;border-radius:20px;padding:18px;margin:8px 0 14px}
.hero .t{font-size:24px;font-weight:700}.hero .s{opacity:.9}
.hero .rot{display:flex;align-items:center;gap:6px;margin:8px 0 4px;font-size:13px;font-weight:600}.hero .rot span{padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.18);opacity:.85}.hero .rot span.on{background:#fff;color:var(--acc2);opacity:1}.hero .rot i{font-style:normal;opacity:.7}.hero .nextday{font-size:13px;margin-top:4px}
.pill{display:inline-block;background:rgba(255,255,255,.22);border-radius:99px;padding:3px 10px;font-size:13px;margin:8px 6px 0 0}
.block{border-left:3px solid var(--acc);padding-left:10px;margin:12px 0}.block .bt{font-weight:600}
.ex{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}.ex:last-child{border:0}
.ex small{color:var(--mut)}
.ex{align-items:center;gap:10px}
.thumb{width:56px;height:56px;object-fit:cover;object-position:center 40%;border-radius:10px;background:#eef1ef;flex:0 0 56px}
.pimg{background:#e9e9e9;border-radius:16px;overflow:hidden;margin:10px 0 0;height:min(19vh,190px);flex-shrink:0;display:flex;justify-content:center}
.pimg img{height:100%;width:auto;max-width:100%;object-fit:contain}
.pimg.dim img{opacity:.55}
.cues{margin-top:6px;font-size:15px;line-height:1.3;color:#14532d;font-weight:600}.cues.dim{color:var(--mut);font-weight:400}.cues b{color:var(--txt)}
.ex.lib{cursor:pointer}
.libdet{padding:8px 0 12px;border-bottom:1px solid var(--line)}.libdet img{width:49%;border-radius:10px;background:#e9e9e9;margin-right:1%}.libdet ul{margin:4px 0 0;padding-left:20px}.libdet li{margin:3px 0}
button{font:inherit;border:0;border-radius:14px;padding:14px 18px;background:var(--card2);color:var(--txt);cursor:pointer}
button.pri{background:var(--acc);color:#fff;font-weight:700;width:100%;font-size:18px}
.row{display:flex;gap:10px}.row>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border-radius:0;padding:14px 0;color:var(--mut);font-size:14px}nav button.on{color:var(--acc)}
.hidden{display:none!important}
/* player */
#player{position:fixed;inset:0;overflow-y:auto;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
#player.work{background:radial-gradient(circle at 50% 35%,#dcf3e5,var(--bg) 70%)}
#player.rest{background:radial-gradient(circle at 50% 35%,#dde9fb,var(--bg) 70%)}
.phase{font-size:15px;letter-spacing:.15em;font-weight:700;text-transform:uppercase}
.work .phase{color:var(--acc)}.rest .phase{color:var(--rest)}
.exname{font-size:28px;font-weight:800;margin:4px 0 2px;line-height:1.15}
.ring{position:relative;width:min(42vw,18vh,200px);aspect-ratio:1;margin:6px auto;flex-shrink:0}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(15vw,8vh,64px);font-weight:800;font-variant-numeric:tabular-nums}
.next{background:var(--card);border-radius:14px;padding:10px 12px;margin-top:auto;flex-shrink:0;display:flex;gap:12px;align-items:center}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--acc)}
.ctrl{display:flex;gap:10px;margin-top:10px;flex-shrink:0}.ctrl button{flex:1;font-size:17px}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:14px}
select,input{width:100%;font:inherit;background:#fff;color:var(--txt);border:1px solid #c9d3ce;border-radius:10px;padding:10px}
.chk{display:flex;align-items:center;gap:10px;margin:8px 0}.chk input{width:auto}
.logrow{display:grid;grid-template-columns:1fr 64px 56px 64px;gap:6px;align-items:center;margin:6px 0;font-size:14px}
.logrow input{padding:8px}.logrow>div:first-child:only-of-type{grid-column:auto}
.tempo{margin:8px auto 0;flex-shrink:0;display:flex;align-items:baseline;justify-content:center;gap:12px;padding:6px 16px;border-radius:14px;background:#e6effc;border:1px solid #c9daf5;max-width:320px}
.tempo .tph{font-size:26px;font-weight:800;letter-spacing:.5px}.tempo .trep{font-size:14px;color:#3d4f6b}
.tempo.plain .tph{display:none}.tempo[data-phase=slow] .tph{color:var(--rest)}.tempo[data-phase=hold] .tph,.tempo[data-phase=pause] .tph{color:#9a6200}.tempo[data-phase=drive] .tph{color:var(--acc)}
.demo{display:inline-block;background:#e6effc;color:var(--rest);text-decoration:none;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.demo.sm{padding:3px 8px;margin:4px 0 0 6px;font-size:12px;border-radius:8px}
.pimg{position:relative}.pimg .demo{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.72);color:#fff;padding:6px 10px;font-size:13px}
.swap,.avoid{border:0;border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;background:#e6effc;color:var(--rest);cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;white-space:nowrap}
.swap.sm{background:#e6effc;color:var(--rest);padding:4px 9px;font-size:12px;margin-top:4px;border-radius:8px}
.avoid.sm{background:none;color:#b42318;padding:0;font-size:12px}
.swapbar{position:absolute;left:6px;top:6px;display:flex;gap:6px;right:6px}
.swapbar .avoid{overflow:hidden;text-overflow:ellipsis;min-width:0}
.swapnote{font-size:12px;color:#8a4b00;margin-top:3px}
.tag{font-size:11px;background:var(--acc);color:#fff;border-radius:6px;padding:1px 6px;vertical-align:middle}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}#toast.on{opacity:1}
.pimg .swap,.pimg .avoid{background:rgba(0,0,0,.72);color:#fff}
input[type=checkbox]{accent-color:var(--acc)}
.restov{display:flex;align-items:center;gap:10px;margin:6px 0 8px}.restov select{width:auto;flex:1;padding:6px 8px}
.pimg.small{height:min(11vh,110px)}
.lastline{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:14px;color:var(--mut)}.lastline b{color:var(--rest)}
.setlog{margin-top:10px;background:#fff;border:2px solid var(--rest);border-radius:16px;padding:10px 12px}
.setlog .slh{font-size:15px;margin-bottom:8px}.setlog .slm{font-size:12px;margin-top:6px;text-align:center}
.stps{display:flex;gap:8px}.stp{flex:1;display:flex;align-items:center;justify-content:space-between;background:#eef3fb;border-radius:14px;padding:4px}
.stp button{width:46px;height:50px;border-radius:12px;font-size:28px;line-height:1;padding:0;background:var(--rest);color:#fff;font-weight:700;touch-action:manipulation}
.stp .v{text-align:center;min-width:48px}.stp .v b{display:block;font-size:24px;color:var(--txt)}.stp .v small{color:var(--mut);font-size:12px}
</style>
</head>
<body>
<header><h1 id="title">Today</h1><div class="mut" id="sub"></div></header>
<main class="wrap">
  <section id="tab-today"></section>
  <section id="tab-history" class="hidden"></section>
  <section id="tab-library" class="hidden"></section>
  <section id="tab-settings" class="hidden"></section>
</main>
<nav>
  <button data-tab="today" class="on">Today</button>
  <button data-tab="history">History</button>
  <button data-tab="library">Library</button>
  <button data-tab="settings">Settings</button>
</nav>
<div id="player" class="hidden"></div>
<script src="app.js"></script>
</body>
</html>
